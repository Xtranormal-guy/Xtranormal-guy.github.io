<!DOCTYPE html>
<html>
<body>
    <p>Your IP Address is: <span id="ip">Loading...</span></p>

    <script>
        fetch('https://api.ipify.org?format=json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('ip').textContent = data.ip;
            })
            .catch(error => console.error('Error:', error));
    </script>
</body>
</html>
